[build]
builder = "NIXPACKS"
buildCommand = "if [ -d backend ]; then cd backend; fi; python -m pip install -e ."

[build.nixpacksPlan]
providers = ["python"]

[deploy]
startCommand = "if [ -d backend ]; then cd backend; fi; python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
