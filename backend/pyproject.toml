[project]
name = "rival-task-manager-api"
version = "0.1.0"
description = "FastAPI backend for the Rival task manager assessment"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17.0",
  "bcrypt>=5.0.0",
  "email-validator>=2.3.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.3.0",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
  "sqlalchemy>=2.0.45",
  "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
